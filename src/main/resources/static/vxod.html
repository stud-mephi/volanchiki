<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Volanchiki</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #bfbfdb; min-height: 100vh; }
        .navbar { background: rgba(255,255,255,0.95); padding: 1rem 0; position: sticky; top: 0; z-index: 1000; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 30px; flex-wrap: wrap; }
        .logo-link img { max-width: 100%; height: auto; width: 300px; }
        .nav-menu { display: flex; list-style: none; gap: 2rem; flex-wrap: wrap; }
        .nav-menu a { text-decoration: none; color: #0b0829; font-weight: 500; font-size: 18px; }
        .auth-container { max-width: 450px; margin: 3rem auto; padding: 0 20px; }
        .auth-card { background: white; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); overflow: hidden; }
        .auth-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 30px; text-align: center; color: white; }
        .auth-header h2 { font-size: 28px; margin-bottom: 5px; }
        .auth-body { padding: 30px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #333; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #667eea; }
        .btn-auth { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: 600; cursor: pointer; }
        .auth-footer { text-align: center; margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee; }
        .auth-footer a { color: #667eea; font-weight: 600; }
        .msg { text-align: center; margin-top: 10px; padding: 10px; border-radius: 8px; display: none; }
        .msg.error { background: #ffebee; color: #c62828; }
        .msg.success { background: #e8f5e9; color: #2e7d32; }
        footer { margin-top: 40px; padding: 20px; border-top: 1px solid #eee; text-align: center; }
        footer a { text-decoration: none; color: #333; font-weight: bold; margin: 0 15px; }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="nav-container">
        <a href="Glavnay.html" class="logo-link"><img src="logo.jpg" alt="Volanchiki" width="300"></a>
        <ul class="nav-menu">
            <li><a href="Glavnay.html">Главная</a></li>
            <li><a href="Kalendar.html">Календарь</a></li>
        </ul>
    </div>
</nav>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header"><h2>🔑 Вход</h2><p>Добро пожаловать!</p></div>
        <div class="auth-body">
            <form id="loginForm">
                <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="example@mail.ru" required></div>
                <div class="form-group"><label>Пароль</label><input type="password" id="loginPassword" placeholder="Введите пароль" required></div>
                <div class="form-group">
                    <label>Я вхожу как *</label>
                    <select id="loginRole" required>
                        <option value="PLAYER">🏸 Игрок</option>
                        <option value="ORGANIZER">📋 Организатор</option>
                    </select>
                </div>
                <button type="submit" class="btn-auth">Войти</button>
            </form>
            <div class="msg" id="msg"></div>
            <div class="auth-footer"><a href="reg.html">Нет аккаунта? Зарегистрироваться</a></div>
        </div>
    </div>
</div>

<footer><a href="#">Контакты</a></footer>

<script>
const API='/api';
document.getElementById('loginForm').addEventListener('submit',async function(e){
e.preventDefault();
const email=document.getElementById('loginEmail').value;
const password=document.getElementById('loginPassword').value;
const role=document.getElementById('loginRole').value;
const m=document.getElementById('msg');m.style.display='none';m.className='msg';
try{const r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
if(r.ok){const d=await r.json();localStorage.setItem('auth_token',d.token);localStorage.setItem('volanchiki_user',JSON.stringify({id:d.userId,fullName:d.fullName,nickname:d.nickname,role:d.role}));localStorage.setItem('isLoggedIn','true');
if(role==='ORGANIZER'&&d.role!=='ORGANIZER'){m.textContent='❌ Вы не организатор. Войдите как игрок.';m.className='msg error';m.style.display='block';return}
m.textContent='✅ Вход выполнен!';m.className='msg success';m.style.display='block';
setTimeout(()=>{location.href=role==='ORGANIZER'?'orglist.html':'profile.html';},1000)}
else{const t=await r.text();m.textContent='❌ '+(t||'Неверный email или пароль');m.className='msg error';m.style.display='block'}}
catch(e){m.textContent='❌ Сервер недоступен';m.className='msg error';m.style.display='block'}
});
</script>
</body>
</html>
