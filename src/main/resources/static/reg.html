<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Volanchiki</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #bfbfdb; min-height: 100vh; }
        .navbar { background: rgba(255,255,255,0.95); padding: 1rem 0; position: sticky; top: 0; z-index: 1000; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 30px; flex-wrap: wrap; }
        .logo-link img { max-width: 100%; height: auto; width: 300px; }
        .nav-menu { display: flex; list-style: none; gap: 2rem; flex-wrap: wrap; }
        .nav-menu a { text-decoration: none; color: #0b0829; font-weight: 500; font-size: 18px; }
        .auth-container { max-width: 550px; margin: 2rem auto; padding: 0 20px; }
        .auth-card { background: white; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); overflow: hidden; }
        .auth-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 30px; text-align: center; color: white; }
        .auth-header h2 { font-size: 28px; margin-bottom: 5px; }
        .auth-body { padding: 30px; }
        .form-row { display: flex; gap: 15px; }
        .form-group { flex: 1; margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #333; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #667eea; }
        .btn-auth { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: 600; cursor: pointer; }
        .auth-footer { text-align: center; margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee; }
        .auth-footer a { color: #667eea; font-weight: 600; }
        .msg { text-align: center; margin-top: 10px; padding: 10px; border-radius: 8px; display: none; }
        .msg.error { background: #ffebee; color: #c62828; }
        .msg.success { background: #e8f5e9; color: #2e7d32; }
        footer { margin-top: 40px; padding: 20px; border-top: 1px solid #eee; text-align: center; }
        footer a { text-decoration: none; color: #333; font-weight: bold; margin: 0 15px; }
        @media (max-width: 600px) { .form-row { flex-direction: column; gap: 0; } }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="nav-container">
        <a href="Glavnay.html" class="logo-link"><img src="logo.jpg" alt="Volanchiki" width="300"></a>
        <ul class="nav-menu">
            <li><a href="Glavnay.html">Главная</a></li>
            <li><a href="Kalendar.html">Календарь</a></li>
        </ul>
    </div>
</nav>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header"><h2>📝 Регистрация</h2><p>Присоединяйтесь к сообществу!</p></div>
        <div class="auth-body">
            <form id="registerForm">
                <div class="form-row">
                    <div class="form-group"><label>Фамилия *</label><input type="text" id="regSurname" placeholder="Иванов" required></div>
                    <div class="form-group"><label>Имя *</label><input type="text" id="regName" placeholder="Иван" required></div>
                </div>
                <div class="form-group"><label>Email *</label><input type="email" id="regEmail" placeholder="ivan@example.com" required></div>
                <div class="form-row">
                    <div class="form-group"><label>Никнейм *</label><input type="text" id="regNick" placeholder="ShuttleKing" required></div>
                    <div class="form-group"><label>Дата рождения *</label><input type="date" id="regBirthDate" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Пол *</label><select id="regGender" required><option value="">Выберите</option><option value="MALE">Мужской</option><option value="FEMALE">Женский</option></select></div>
                    <div class="form-group"><label>Телефон</label><input type="tel" id="regPhone" placeholder="+7 900 123-45-67"></div>
                </div>
                <div class="form-group"><label>Город</label><input type="text" id="regCity" placeholder="Москва"></div>
                <div class="form-group">
                    <label>Я регистрируюсь как *</label>
                    <select id="regRole" required>
                        <option value="PLAYER">🏸 Игрок</option>
                        <option value="ORGANIZER">📋 Организатор</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Пароль *</label><input type="password" id="regPassword" placeholder="Минимум 6 символов" required minlength="6"></div>
                    <div class="form-group"><label>Подтверждение *</label><input type="password" id="regConfirm" placeholder="Повторите пароль" required></div>
                </div>
                <button type="submit" class="btn-auth">Зарегистрироваться</button>
            </form>
            <div class="msg" id="msg"></div>
            <div class="auth-footer">Уже есть аккаунт? <a href="vxod.html">Войти</a></div>
        </div>
    </div>
</div>

<footer><a href="#">Контакты</a></footer>

<script>
const API='/api';
document.getElementById('registerForm').addEventListener('submit',async function(e){
e.preventDefault();
const p=document.getElementById('regPassword').value;
const c=document.getElementById('regConfirm').value;
const m=document.getElementById('msg');m.style.display='none';m.className='msg';
if(p!==c){m.textContent='❌ Пароли не совпадают!';m.className='msg error';m.style.display='block';return}
const d={
fullName:document.getElementById('regSurname').value+' '+document.getElementById('regName').value,
nickname:document.getElementById('regNick').value,
email:document.getElementById('regEmail').value,
password:p,
birthDate:document.getElementById('regBirthDate').value,
gender:document.getElementById('regGender').value,
phone:document.getElementById('regPhone').value,
city:document.getElementById('regCity').value,
role:document.getElementById('regRole').value
};
try{const r=await fetch(API+'/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
if(r.ok){const x=await r.json();localStorage.setItem('auth_token',x.token);localStorage.setItem('volanchiki_user',JSON.stringify({id:x.userId,fullName:x.fullName,nickname:x.nickname,role:x.role}));localStorage.setItem('isLoggedIn','true');
m.textContent='✅ Успешно!';m.className='msg success';m.style.display='block';
setTimeout(()=>{location.href=x.role==='ORGANIZER'?'orglist.html':'profile.html';},1000)}
else{const t=await r.text();m.textContent='❌ '+(t||'Ошибка');m.className='msg error';m.style.display='block'}}
catch(e){m.textContent='❌ Сервер недоступен';m.className='msg error';m.style.display='block'}
});
</script>
</body>
</html>
